<!DOCTYPE html>
<html>
<head>
<title>Table</title>
<style>
body{
  font-family: Arial, sans-serif;
  text-align: center;
  margin-top: 100px;
}
table{ margin: 0 auto; border-collapse: collapse; }
td, th{ border: 1px solid black; padding: 6px 14px; }
a{
  display: inline-block;
  margin-top: 30px;
  padding: 6px 12px;
  border: 1px solid black;
  text-decoration: none;
  color: black;
}
a:hover{ background: black; color: white; }
</style>
</head>
<body>
<h1>Table</h1>
<table>
  <tr><th>Name</th><th>Color</th><th>Number</th></tr>
  <tr><td>Alice</td><td>Red</td><td>1</td></tr>
  <tr><td>Bob</td><td>Blue</td><td>2</td></tr>
  <tr><td>Carol</td><td>Green</td><td>3</td></tr>
</table>
